## DAY 8 — IAM Policy Evaluation, Explicit Deny and Least Privilege

### Lab 1 — Identify Caller
```bash
aws sts get-caller-identity
```
Record account, ARN and principal type before changing any policy.

### Lab 2 — Inspect Identity Policies
```bash
aws iam list-attached-role-policies --role-name <role-name>
aws iam list-role-policies --role-name <role-name>
aws iam get-policy-version --policy-arn <policy-arn> --version-id <version-id>
```
Map statements to action, resource and conditions.

### Lab 3 — Inspect Resource Policy
```bash
aws s3api get-bucket-policy --bucket <bucket-name>
```
Find matching Allow and Deny statements.

### Lab 4 — Policy Simulator
```bash
aws iam simulate-principal-policy --policy-source-arn <principal-arn> --action-names s3:GetObject --resource-arns arn:aws:s3:::<bucket>/*
```
Record the decision and identify policy layers not represented by the test.

### Lab 5 — Explicit Deny
Create a controlled S3 case where identity policy allows an action but a resource-policy condition denies it. Prove that the explicit Deny wins.

### Lab 6 — Least-Privilege Cleanup
Reduce an intentionally broad permission such as `s3:*` on `*` to the minimum required action/resource set and retest.

### DAY 8 Capstone — AccessDenied Decision Tree
Record caller, action, resource, identity policy, resource policy, boundary, session policy, SCP, conditions, explicit denies and final decision. Do not use AdministratorAccess as the fix.


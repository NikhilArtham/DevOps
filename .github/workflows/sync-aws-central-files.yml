## DAY 6 — EC2 Boot, User-Data, Metadata and System Troubleshooting

### Lab 1 — EC2 State, Status Checks and Boot Evidence
```bash
aws ec2 describe-instances --instance-ids <instance-id> --query 'Reservations[].Instances[].{State:State.Name,Subnet:SubnetId,PrivateIP:PrivateIpAddress}'
aws ec2 describe-instance-status --instance-ids <instance-id> --include-all-instances
```
Record instance state, system status, instance status and the observed symptom.

### Lab 2 — User-Data and cloud-init Failure
```bash
cloud-init status --long
sudo tail -n 100 /var/log/cloud-init.log
sudo tail -n 100 /var/log/cloud-init-output.log
```
Identify the first failed bootstrap command and determine whether it prevented the application from starting.

### Lab 3 — IMDSv2
```bash
TOKEN=$(curl -sS -X PUT 'http://169.254.169.254/latest/api/token' -H 'X-aws-ec2-metadata-token-ttl-seconds: 21600')
curl -sS -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id
```
Explain the token flow and inspect the instance metadata options.

### Lab 4 — SSH and Application Port Troubleshooting
```bash
sudo systemctl status sshd
ss -lntp | grep ':22'
ss -lntp
curl -v http://127.0.0.1:<port>/health
curl -v http://<private-ip>:<port>/health
```
Separate network access, SSH service, listener binding and application health.

### Lab 5 — SSM Access Path
```bash
aws ssm describe-instance-information
aws ssm start-session --target <instance-id>
```
Explain the IAM, agent and network prerequisites.

### DAY 6 Capstone — EC2 Boot Failure
Scenario: EC2 is `running`, ALB target is unhealthy, and the application should listen on `:8080`. Use status checks, SSM, cloud-init, systemd, `ss` and `curl` to identify whether the root cause is AWS networking or instance bootstrap/application startup.


## DAY 9 — Cross-account IAM Roles and Trust Policies

### Lab 1 — Two-Gate AssumeRole Path
Document: source principal → `sts:AssumeRole` permission → target role trust policy → temporary role session → target API permission.

### Lab 2 — Inspect Trust Policy
```bash
aws iam get-role --role-name <role-name> --query 'Role.AssumeRolePolicyDocument'
```
Check principal, `sts:AssumeRole` and relevant conditions.

### Lab 3 — Test AssumeRole
```bash
aws sts assume-role --role-arn arn:aws:iam::<target-account>:role/<role-name> --role-session-name devops-lab
aws sts get-caller-identity
```

### Lab 4 — Separate Trust from Target Permissions
If AssumeRole succeeds but the target API fails, investigate target-role permissions, resource policies, KMS, SCPs, boundaries and conditions instead of changing trust.

### Lab 5 — Least-Privilege Trust
Compare trusting an entire source account with trusting the exact CI role. Explain the security difference.

### DAY 9 Capstone — CI-to-Production AccessDenied
Trace Account A CI role → Account B production role → S3 API. Identify the exact failing gate and make only the required trust/permission change.


## DAY 6 — EC2 Boot, User-Data, Metadata and System Troubleshooting

### 1. What is the difference between EC2 instance state and status checks?
<details><summary>Answer</summary>Instance state describes whether the instance is running, stopped, etc. Status checks test underlying system and instance reachability/health. A running instance can still have a failed application or failed status check.</details>
### 2. What is user-data?
<details><summary>Answer</summary>User-data is bootstrap input supplied to an EC2 instance, commonly used to install packages, configure services and perform first-boot initialization.</details>
### 3. How do you troubleshoot cloud-init failure?
<details><summary>Answer</summary>Check `cloud-init status --long`, `/var/log/cloud-init.log` and `/var/log/cloud-init-output.log`, then verify whether the intended service was installed, configured and started.</details>
### 4. What is IMDSv2?
<details><summary>Answer</summary>IMDSv2 is the token-based version of the EC2 Instance Metadata Service. A client obtains a session token before making metadata requests.</details>
### 5. Why should an application listener be checked on EC2?
<details><summary>Answer</summary>An EC2 instance can be healthy and running while the application is not listening on the expected port. `ss -lntp` and local `curl` help prove application readiness.</details>
### 6. When would you use SSM instead of SSH?
<details><summary>Answer</summary>Use SSM when you want managed, IAM-authorized access without exposing inbound SSH, especially for private instances.</details>
### 7. What can cause an ALB target to be unhealthy while EC2 is running?
<details><summary>Answer</summary>Bootstrap failure, application startup failure, wrong port/path, response-code mismatch, loopback-only binding, Security Group/NACL or host-level firewall issues can all cause this.</details>
### 8. What does `ss -lntp` show?
<details><summary>Answer</summary>It shows listening TCP sockets, numeric addresses/ports and associated processes where permissions allow.</details>
### 9. Why can localhost work while an ALB health check fails?
<details><summary>Answer</summary>The application may listen only on `127.0.0.1`, allowing local requests but not network requests from the load balancer.
</details>
### 10. Give the EC2 troubleshooting sequence.
<details><summary>Answer</summary>Trace instance state → status checks → network path → access method → bootstrap/system logs → listening port → application health.</details>


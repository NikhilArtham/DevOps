## DAY 7 — Systems Manager: Session Manager, Run Command and Patch

### 1. What is Systems Manager?
<details><summary>Answer</summary>It provides centralized operational capabilities for managed nodes including Session Manager, Run Command, patching, inventory and automation.</details>
### 2. Does Session Manager require inbound SSH?
<details><summary>Answer</summary>No. It is designed to provide access without requiring inbound port 22, provided the node has the required agent, IAM and network connectivity.</details>
### 3. What are the main Session Manager prerequisites?
<details><summary>Answer</summary>A healthy SSM Agent, suitable IAM permissions and network connectivity to the required Systems Manager endpoints.</details>
### 4. What is Run Command?
<details><summary>Answer</summary>Run Command executes commands or SSM documents remotely on managed nodes.</details>
### 5. Why might an SSM command remain Pending?
<details><summary>Answer</summary>The target may not be registered/online as a managed node, the SSM Agent may be unhealthy, or the instance may lack connectivity to Systems Manager services.</details>
### 6. How do you troubleshoot a node missing from SSM?
<details><summary>Answer</summary>Check `describe-instance-information`, SSM Agent service/logs, IAM permissions, network endpoint connectivity and account/region.</details>
### 7. What is Patch Manager used for?
<details><summary>Answer</summary>It helps manage patch operations and assess patch compliance across managed nodes.</details>
### 8. Why is SSM useful for private subnets?
<details><summary>Answer</summary>It can provide operational access without assigning public IPs or exposing SSH, while still requiring private connectivity to Systems Manager services.</details>
### 9. What should you check before changing Security Groups for an SSM failure?
<details><summary>Answer</summary>Check managed-node registration, agent health, IAM and the exact Systems Manager endpoint/network path first.</details>
### 10. Explain Session Manager troubleshooting in one minute.
<details><summary>Answer</summary>Verify managed-node registration → SSM Agent → IAM → endpoint/network connectivity → session/target configuration.</details>

---

## DAY 8 — IAM Policy Evaluation, Explicit Deny and Least Privilege

### 1. What is the basic IAM evaluation model?
<details><summary>Answer</summary>Applicable identity/resource policies and constraints are evaluated for the request. An applicable explicit Deny overrides an Allow.</details>
### 2. Identity policy vs resource policy?
<details><summary>Answer</summary>Identity policies attach to principals; resource policies attach to resources such as S3 buckets and define resource-side access.</details>
### 3. What is an explicit Deny?
<details><summary>Answer</summary>An applicable Deny overrides an Allow and is commonly used for security guardrails.</details>
### 4. What is a permissions boundary?
<details><summary>Answer</summary>It defines the maximum permissions an identity-based policy can grant to the principal.</details>
### 5. What is an SCP?
<details><summary>Answer</summary>An SCP limits the maximum available permissions for accounts/OUs in AWS Organizations; it does not itself grant permissions.</details>
### 6. Why start with `sts get-caller-identity`?
<details><summary>Answer</summary>Because you must know which principal actually made the request before evaluating its policies.</details>
### 7. What does IAM Policy Simulator help prove?
<details><summary>Answer</summary>It helps evaluate whether a principal is allowed or denied for specified actions/resources, especially identity-policy behavior.</details>
### 8. Why not fix AccessDenied with AdministratorAccess?
<details><summary>Answer</summary>It hides the root cause, violates least privilege and increases production risk.</details>
### 9. Can an Allow overcome an explicit Deny?
<details><summary>Answer</summary>No. An applicable explicit Deny wins.</details>
### 10. Give an IAM AccessDenied sequence.
<details><summary>Answer</summary>Caller → action → resource → identity policy → resource policy → boundary/session policy → SCP → conditions → explicit Deny → retest.</details>

---

## DAY 9 — Cross-account IAM Roles and Trust Policies

### 1. What are the two main gates for AssumeRole?
<details><summary>Answer</summary>The source principal must be allowed to call `sts:AssumeRole`, and the target role trust policy must trust that principal under the required conditions.</details>
### 2. Trust policy vs permissions policy?
<details><summary>Answer</summary>The trust policy controls who may assume the role; the permissions policy controls what the assumed role may do.</details>
### 3. Does a trust policy grant S3 access?
<details><summary>Answer</summary>No. It grants the ability to assume the role. Target permissions determine what the resulting role session can do.</details>
### 4. How do you verify the assumed identity?
<details><summary>Answer</summary>Use `aws sts get-caller-identity` with the temporary credentials.</details>
### 5. Why trust an exact CI role instead of an entire account?
<details><summary>Answer</summary>It reduces the set of principals that can assume the role and therefore follows least privilege.</details>
### 6. What is ExternalId for?
<details><summary>Answer</summary>It can be used in trust-policy conditions, especially for third-party access, to reduce confused-deputy risk.</details>
### 7. AssumeRole succeeds but S3 fails. What does that indicate?
<details><summary>Answer</summary>The basic trust and AssumeRole path worked; investigate target-role permissions, S3 resource policy, KMS and organization/session constraints.</details>
### 8. What is a common cross-account mistake?
<details><summary>Answer</summary>Changing target permissions when trust is failing, or changing trust after AssumeRole already succeeds.</details>
### 9. What should you test separately?
<details><summary>Answer</summary>Test source `sts:AssumeRole` authorization separately from the assumed role's target API authorization.</details>
### 10. Explain cross-account access in one minute.
<details><summary>Answer</summary>Source permission + target trust must permit AssumeRole, then the resulting role session must have the target API permissions, subject to resource policies, SCPs, boundaries, session policies, conditions and explicit denies.</details>

---

## DAY 10 — S3 Security, Encryption, Bucket Policies and Access Troubleshooting

### 1. Bucket ARN vs object ARN?
<details><summary>Answer</summary>The bucket ARN is `arn:aws:s3:::bucket-name`; object resources are commonly `arn:aws:s3:::bucket-name/*`. `ListBucket` and `GetObject` therefore usually use different resource ARNs.</details>
### 2. What is S3 Block Public Access?
<details><summary>Answer</summary>It provides controls designed to prevent public access configurations at the account/bucket level.</details>
### 3. What is a bucket policy?
<details><summary>Answer</summary>A bucket policy is a resource-based policy defining which principals can access the bucket/objects and under what conditions.</details>
### 4. Can an Allow override an explicit Deny?
<details><summary>Answer</summary>No. An applicable explicit Deny wins.</details>
### 5. SSE-S3 vs SSE-KMS?
<details><summary>Answer</summary>Both provide server-side encryption, but SSE-KMS uses AWS KMS keys and introduces separate KMS authorization/key-policy considerations.</details>
### 6. Why can GetObject fail when s3:GetObject is allowed?
<details><summary>Answer</summary>Bucket-policy Deny, Block Public Access, conditions, SCP/boundary/session restrictions or KMS authorization can still block the request.</details>
### 7. What should you inspect for an SSE-KMS AccessDenied?
<details><summary>Answer</summary>Inspect the KMS key state, key policy, required KMS permissions and any explicit deny/condition. S3 authorization alone is not sufficient.</details>
### 8. How do you troubleshoot S3 AccessDenied?
<details><summary>Answer</summary>Identify caller/action/resource, then inspect IAM, bucket policy, Block Public Access, ownership/ACLs, encryption/KMS, endpoint policy, SCP/boundary, conditions and explicit denies. Retest the exact operation.</details>
### 9. What does aws:SecureTransport enforce?
<details><summary>Answer</summary>A bucket-policy condition can deny requests that are not using secure transport, enforcing HTTPS for the access path.</details>
### 10. How can aws:SourceVpce affect access?
<details><summary>Answer</summary>A bucket policy can restrict access to a specific VPC endpoint, so the same principal can succeed through the approved endpoint and fail through another path.</details>


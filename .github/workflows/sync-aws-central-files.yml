## DAY 7 — Systems Manager: Session Manager, Run Command and Patch

### Lab 1 — Verify Managed Node
```bash
aws ssm describe-instance-information
sudo systemctl status amazon-ssm-agent
```
Prove whether the node is registered and whether the agent is healthy.

### Lab 2 — Session Manager
```bash
aws ssm start-session --target <instance-id>
```
Compare Session Manager with SSH and explain why inbound port 22 is not required.

### Lab 3 — Run Command
```bash
aws ssm send-command --instance-ids <instance-id> --document-name 'AWS-RunShellScript' --parameters 'commands=["hostname","uptime","df -h"]'
```
Inspect the command result and identify the IAM permission required to send it.

### Lab 4 — Diagnose SSM Failure
Investigate a node that is missing, offline, or stuck in Pending. Check managed-node registration, SSM Agent, IAM role and endpoint/network connectivity.

### Lab 5 — Patch Compliance
Inspect patch compliance for a managed node. Record missing, installed and failed patches and explain why compliance is broader than checking one package manually.

### DAY 7 Capstone — SSM Access Incident
EC2 is running but Session Manager cannot connect. Prove which prerequisite fails: managed-node registration, SSM Agent, IAM, endpoint/network connectivity or target state.


## DAY 11 — RDS HA, Backups, Multi-AZ and Connection Troubleshooting

### 1. What is the RDS connection path?
<details><summary>Answer</summary>Application/client → RDS DNS endpoint → DNS resolution → network path → RDS Security Group → database port → RDS database state → authentication/application. Troubleshoot in this order rather than jumping directly to credentials.</details>
### 2. What is Multi-AZ in RDS?
<details><summary>Answer</summary>Multi-AZ provides a standby deployment in another Availability Zone for high availability and managed failover. It is primarily an availability feature, not a read-scaling feature for a standard Multi-AZ DB instance.</details>
### 3. What are automated RDS backups used for?
<details><summary>Answer</summary>They support recovery objectives such as point-in-time recovery within the configured retention period. Backups address data recovery; Multi-AZ addresses availability/failover.</details>
### 4. Does Multi-AZ replace backups?
<details><summary>Answer</summary>No. Multi-AZ is for availability and failover. Backups are required for recovery scenarios such as accidental data changes or restoring to a point in time.</details>
### 5. What should you check first when an RDS client cannot connect?
<details><summary>Answer</summary>Check the RDS endpoint and DNS resolution, then TCP reachability to the correct database port, Security Group rules, subnet/network path, RDS status and finally database authentication/application behavior.</details>
### 6. DNS resolves but TCP connection times out. What layer is most likely?
<details><summary>Answer</summary>The failure is likely in the network path or security controls: routing, NACL, Security Group, network reachability or an unavailable listener/service path. It is not primarily a DNS failure.</details>
### 7. TCP connects but the database rejects the client. What does that tell you?
<details><summary>Answer</summary>The DNS and basic network/port path worked. Investigate database state, authentication, credentials, database-level authorization, TLS settings or application connection configuration.</details>
### 8. How do you inspect Multi-AZ and backup settings with AWS CLI?
<details><summary>Answer</summary>Use `aws rds describe-db-instances --db-instance-identifier <id>` and inspect `MultiAZ`, `BackupRetentionPeriod`, `PreferredBackupWindow` and related fields.</details>
### 9. What is an RDS DB subnet group?
<details><summary>Answer</summary>It defines the subnets in which RDS can place the database network interfaces. A resilient design uses subnets across appropriate Availability Zones.</details>
### 10. Why should applications use the RDS endpoint instead of a hard-coded IP?
<details><summary>Answer</summary>The managed endpoint abstracts the underlying database instance/network identity and supports managed failover behavior. Hard-coded IPs can break during infrastructure changes or failover.</details>
### 11. Can a running RDS instance still have connection failures?
<details><summary>Answer</summary>Yes. `available`/running state does not prove the client's DNS, route, Security Group, port, TLS or authentication path is correct.</details>
### 12. What is the difference between Multi-AZ and a read replica?
<details><summary>Answer</summary>Standard Multi-AZ is primarily for high availability and failover. Read replicas are primarily used for read scaling and replication-based use cases. They solve different problems.</details>
### 13. What should you inspect if an RDS Security Group appears correct?
<details><summary>Answer</summary>Verify the actual client source, destination port, attached RDS Security Group, subnet/NACL path, DNS result and whether the client is using the expected endpoint and port. A correct-looking rule for the wrong source or port is still a failure.</details>
### 14. Why is `nc -vz` useful for RDS troubleshooting?
<details><summary>Answer</summary>It tests TCP reachability to the endpoint and port without requiring database authentication, helping separate network/port failures from database authentication failures.</details>
### 15. Does a backup fix a blocked RDS Security Group?
<details><summary>Answer</summary>No. Backups are a recovery mechanism, not a network-access mechanism. A Security Group/route/port failure must be fixed at the connection layer.</details>
### 16. What is a good RDS troubleshooting matrix?
<details><summary>Answer</summary>DNS failure → name-resolution layer; DNS works + TCP timeout → route/SG/NACL/network layer; TCP connects + DB rejects → database/authentication/TLS layer; RDS service state unhealthy → AWS database/service layer.</details>
### 17. Why does Multi-AZ matter during an AZ failure?
<details><summary>Answer</summary>The standby in another Availability Zone is intended to support managed failover so the database can remain available despite an AZ-level failure, subject to the service's failover behavior and application reconnection.</details>
### 18. What should an application do after an RDS failover?
<details><summary>Answer</summary>It should reconnect using the RDS endpoint and handle transient connection errors with appropriate retry/backoff behavior. It should not depend on a fixed database IP.</details>
### 19. What is the key production mistake in RDS troubleshooting?
<details><summary>Answer</summary>Changing multiple layers at once. First prove DNS, then TCP reachability, then security controls, then RDS state, then database authentication/application behavior. This preserves evidence and reduces risky changes.</details>
### 20. Explain RDS connection troubleshooting in one minute.
<details><summary>Answer</summary>I start with the RDS endpoint and DNS, then test the database port with `nc`, inspect the client's route and RDS Security Group/NACL path, verify RDS status and Multi-AZ/backup configuration, and only then investigate database authentication/TLS/application behavior. I distinguish HA and recovery: Multi-AZ improves availability and failover, while backups support restore and point-in-time recovery. I fix the first proven failing layer and retest the exact connection.</details>

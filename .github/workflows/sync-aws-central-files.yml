## DAY 10 — S3 Security, Encryption, Bucket Policies and Access Troubleshooting

### Lab 1 — Identify Caller and Exact Operation
```bash
aws sts get-caller-identity
aws s3api head-object --bucket <bucket> --key <key>
aws s3api get-object --bucket <bucket> --key <key> /tmp/object
```
Record principal, action, bucket/object ARN and exact error.

### Lab 2 — Bucket Policy and Public Access Controls
```bash
aws s3api get-bucket-policy --bucket <bucket>
aws s3api get-public-access-block --bucket <bucket>
aws s3api get-bucket-ownership-controls --bucket <bucket>
```
Identify matching Allow/Deny statements and whether Block Public Access changes the result.

### Lab 3 — Encryption and KMS
```bash
aws s3api get-bucket-encryption --bucket <bucket>
```
If SSE-KMS is used, identify the KMS key and trace S3 authorization separately from KMS authorization.

### Lab 4 — Secure Transport and VPC Endpoint Conditions
Investigate bucket-policy conditions such as `aws:SecureTransport` and `aws:SourceVpce`. Explain why the same principal can succeed through one path and fail through another.

### Lab 5 — PutObject Encryption Enforcement
Test an upload against a controlled bucket policy that requires a specific encryption configuration. Identify the exact Deny when the condition is missing.

### Lab 6 — S3 Access Matrix
For each AccessDenied case classify the first failing layer: IAM, bucket policy, Block Public Access, Object Ownership/ACL, S3 encryption, KMS, endpoint policy, SCP/boundary or condition.

### DAY 10 Capstone — SSE-KMS GetObject Failure
Application role receives `AccessDenied` for an SSE-KMS object. Trace caller → `s3:GetObject` → bucket policy → public-access controls → ownership/ACL → KMS → explicit denies/conditions. Apply the least-privilege fix and validate the exact request.


name: Sync AWS central study files
on:
  push:
    paths:
      - 'aws/DAY 11 - RDS HA Backups Multi-AZ and Connection Troubleshooting.md'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append centralized AWS study content
        shell: bash
        run: |
          set -euo pipefail
          cat .github/aws-labs-additions.md >> aws/LABS.md
          cat .github/aws-interview-additions.md >> 'aws/INTERVIEW QUESTIONS.md'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aws/LABS.md 'aws/INTERVIEW QUESTIONS.md'
          git commit -m 'docs: update AWS labs and interview questions through day 11' || exit 0
          git push

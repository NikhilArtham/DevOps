## DAY 11 — RDS HA, Backups, Multi-AZ and Connection Troubleshooting

### Lab 1 — Map the RDS Connection Path
```bash
aws rds describe-db-instances --db-instance-identifier <db-id> --query 'DBInstances[].{Endpoint:Endpoint.Address,Port:Endpoint.Port,Status:DBInstanceStatus,AZ:AvailabilityZone,MultiAZ:MultiAZ,Engine:Engine}'
```
From the client, trace:
```text
Application
→ RDS DNS endpoint
→ DNS resolution
→ subnet/route path
→ RDS Security Group
→ database port
→ RDS database state
→ authentication/application
```
Use `dig`/`nslookup`, `nc -vz <endpoint> <port>`, and the database client where available.

### Lab 2 — Inspect Multi-AZ and Backup Configuration
```bash
aws rds describe-db-instances --db-instance-identifier <db-id> --query 'DBInstances[].{MultiAZ:MultiAZ,BackupRetention:BackupRetentionPeriod,BackupWindow:PreferredBackupWindow,MaintenanceWindow:PreferredMaintenanceWindow,Status:DBInstanceStatus}'
```
Record whether Multi-AZ is enabled and the backup retention/window. Explain the difference between HA/failover and backups/point-in-time recovery.

### Lab 3 — Diagnose RDS Security Group Failure
Confirm the application/client source and RDS Security Group inbound rule for the database port. Test:
```bash
nc -vz <rds-endpoint> 5432
nc -vz <rds-endpoint> 3306
```
Use the actual engine port. Determine whether failure is DNS, network reachability or Security Group filtering.

### Lab 4 — Diagnose DNS vs Port vs Database State
Create a troubleshooting matrix:
```text
DNS fails → endpoint/name-resolution layer
DNS works + TCP timeout → route/SG/NACL/network layer
TCP connects + DB rejects → database/authentication layer
RDS status unavailable/failing → database/service state
```
Prove each conclusion with a command or AWS console/API observation.

### Lab 5 — Inspect Subnet Group and AZ Placement
```bash
aws rds describe-db-subnet-groups --db-subnet-group-name <subnet-group>
```
Map the RDS subnet group to its VPC and Availability Zones. Explain why multi-AZ subnet placement matters for resilient deployment.

### Lab 6 — Failover and Endpoint Exercise
In a permitted non-production environment, inspect the Multi-AZ configuration and document the expected failover behavior. Verify that applications use the RDS endpoint rather than a hard-coded instance IP. Do not perform a production failover as a learning exercise.

### Lab 7 — Backup and Restore Investigation
Inspect automated-backup settings and available snapshots. Explain which recovery objective is served by automated backups/PITR versus a manual snapshot. Record the retention period and recovery workflow for the test database.

### DAY 11 Capstone — RDS Connection Incident
Scenario:
```text
Application → RDS endpoint :5432
Client reports connection timeout
RDS is running
```
Trace in order:
```text
1. RDS endpoint DNS
2. Client route/network path
3. RDS Security Group
4. Port reachability
5. RDS instance status
6. Multi-AZ/HA configuration
7. Database authentication/application
```
Identify the exact failing layer and explain why changing backups or Multi-AZ would not fix a pure Security Group/port problem.

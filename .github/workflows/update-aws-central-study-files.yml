## DAY 7 — Systems Manager: Session Manager, Run Command and Patch

### Lab 1 — Verify SSM Managed-Node Prerequisites
Check:
```text
SSM Agent running
IAM instance role allows SSM
Instance can reach SSM endpoints
Instance appears in Systems Manager
```
Commands:
```bash
aws ssm describe-instance-information
sudo systemctl status amazon-ssm-agent
```

### Lab 2 — Start a Session Manager Shell
```bash
aws ssm start-session --target <instance-id>
```
Inside the session inspect:
```bash
whoami
hostname
uname -a
```
Compare the access path with SSH and explain why no inbound port 22 is required for Session Manager.

### Lab 3 — Run a Command Remotely
```bash
aws ssm send-command \
  --instance-ids <instance-id> \
  --document-name 'AWS-RunShellScript' \
  --parameters 'commands=["hostname","uptime","df -h"]'
```
Retrieve the command ID and inspect its result. Identify the IAM permission needed to send commands.

### Lab 4 — Diagnose Run Command Failure
Investigate:
```text
Target not managed
Command stays Pending
Command fails on instance
IAM AccessDenied
```
Check SSM Agent logs, managed-node status, IAM role and network connectivity before changing unrelated EC2 rules.

### Lab 5 — Patch Compliance Investigation
Inspect patch compliance for a managed node and identify:
```text
Missing patches
Installed patches
Failed patches
Compliance state
```
Explain why patch compliance is different from simply checking whether an OS package is installed.

### Lab 6 — Session Manager Port Forwarding
Use a permitted test environment to forward a local port to a private service through an SSM-managed instance. Record the source port, target host/port and why this can avoid exposing the private service publicly.

### DAY 7 Capstone — SSM Access Incident
Scenario:
```text
EC2 is running
SSH is unavailable by design
Session Manager cannot connect
```
Prove which prerequisite fails: managed-node registration, SSM Agent, IAM, endpoint/network connectivity or service state. Fix only the failing layer and validate the session.


## DAY 6 — EC2 Boot, User-Data, Metadata and System Troubleshooting

### 1. What is the difference between EC2 instance state and status checks?
<details><summary>Answer</summary>Instance state tells you whether EC2 is running, stopped, etc. Status checks test underlying system and instance reachability/health. A running instance can still fail status checks or have an application-level failure.</details>

### 2. What is user-data?
<details><summary>Answer</summary>User-data is bootstrap input supplied to an EC2 instance, commonly used on first boot to install packages, configure services, or run initialization commands.</details>

### 3. How do you troubleshoot user-data failure?
<details><summary>Answer</summary>Check cloud-init status and `/var/log/cloud-init.log` plus `/var/log/cloud-init-output.log`. Then verify whether the intended service was installed, configured and started.</details>

### 4. What is IMDS?
<details><summary>Answer</summary>The Instance Metadata Service provides instance-local metadata such as instance identity and configuration information. IMDSv2 uses a session token for metadata requests.</details>

### 5. Why is IMDSv2 preferred?
<details><summary>Answer</summary>IMDSv2 requires a token obtained through a PUT request before metadata retrieval, reducing exposure to some classes of request-forgery and unintended metadata access.</details>

### 6. An EC2 instance is running but the ALB reports it unhealthy. What do you check?
<details><summary>Answer</summary>Check the target health reason, application listener, expected port/path, local `curl`, `ss -lntp`, service state, host firewall, Security Group/NACL and bootstrap logs. Running state alone does not prove application readiness.</details>

### 7. What is a common cloud-init production failure?
<details><summary>Answer</summary>A package installation or configuration command fails during bootstrap, so the application never starts or never listens on its expected port. The instance can remain healthy from EC2's perspective.</details>

### 8. When would you use SSM instead of SSH?
<details><summary>Answer</summary>SSM Session Manager is useful when SSH should not be exposed, when instances are private, or when centralized audited access is preferred. It depends on SSM Agent, IAM and network connectivity to Systems Manager endpoints.</details>

### 9. What does `ss -lntp` tell you?
<details><summary>Answer</summary>It shows listening TCP sockets, numeric addresses/ports and the associated process where permitted. It is useful for proving whether an application is actually listening on the expected port.</details>

### 10. Explain the EC2 troubleshooting mental model.
<details><summary>Answer</summary>Trace instance state → AWS status checks → network path → access method → bootstrap/system logs → listening port → application health. Do not assume an EC2 `running` state means the application is healthy.</details>

---

## DAY 7 — Systems Manager: Session Manager, Run Command and Patch

### 1. What is AWS Systems Manager?
<details><summary>Answer</summary>Systems Manager provides centralized operational capabilities for managed nodes, including Session Manager, Run Command, patching, inventory and automation.</details>

### 2. What does Session Manager provide?
<details><summary>Answer</summary>It provides shell or command access to managed instances without requiring inbound SSH access. Authentication and authorization are integrated with IAM.</details>

### 3. What are the main Session Manager prerequisites?
<details><summary>Answer</summary>The node needs a working SSM Agent, suitable IAM permissions through its instance role or managed-node identity, and network connectivity to the required Systems Manager endpoints.</details>

### 4. Does Session Manager require inbound port 22?
<details><summary>Answer</summary>No. Session Manager is designed to avoid requiring inbound SSH. The instance must still be able to communicate with Systems Manager services.</details>

### 5. What is Run Command?
<details><summary>Answer</summary>Run Command lets operators execute commands or SSM documents on managed nodes without manually logging into each machine.</details>

### 6. Why can an SSM command remain Pending?
<details><summary>Answer</summary>The target may not be online as a managed node, the SSM Agent may be unhealthy, or the instance may lack network connectivity to Systems Manager services.</details>

### 7. What is Patch Manager used for?
<details><summary>Answer</summary>It helps define patching operations and assess patch compliance across managed nodes. Compliance status is broader than checking one package manually.</details>

### 8. How do you troubleshoot an instance missing from SSM?
<details><summary>Answer</summary>Check `describe-instance-information`, SSM Agent service/logs, IAM instance permissions, instance connectivity to SSM endpoints and whether the node is in the expected account/region.</details>

### 9. Why is SSM valuable for private subnets?
<details><summary>Answer</summary>It can provide operational access without assigning public IPs or exposing SSH to the internet, while still requiring the appropriate private connectivity to SSM services.</details>

### 10. Explain Session Manager troubleshooting in one minute.
<details><summary>Answer</summary>Start with managed-node registration, then SSM Agent, IAM permissions and network reachability to SSM endpoints. If those pass, inspect the command/session configuration and target state.</details>

---

## DAY 8 — IAM Policy Evaluation, Explicit Deny and Least Privilege

### 1. What is the basic IAM evaluation model?
<details><summary>Answer</summary>A request is evaluated across applicable identity and resource policies plus constraints such as permissions boundaries, session policies and SCPs. An applicable explicit deny overrides an allow.</details>

### 2. What is the difference between identity and resource policies?
<details><summary>Answer</summary>Identity policies attach to principals such as users and roles. Resource policies attach to resources such as S3 buckets and can directly define which principals may access them.</details>

### 3. What is an explicit deny?
<details><summary>Answer</summary>An explicit Deny statement that matches the request overrides an Allow. It is commonly used for guardrails such as blocking insecure transport or access outside an approved network path.</details>

### 4. What is a permissions boundary?
<details><summary>Answer</summary>A permissions boundary defines the maximum permissions an identity-based policy can grant to a principal. Adding an Allow outside the boundary does not make that permission effective.</details>

### 5. What is an SCP?
<details><summary>Answer</summary>An AWS Organizations Service Control Policy sets the maximum available permissions for accounts or organizational units. It does not itself grant permissions.</details>

### 6. Why start IAM troubleshooting with `aws sts get-caller-identity`?
<details><summary>Answer</summary>Because the first question is who actually made the request. A correct policy attached to one role does not help if the workload is using another role or identity.</details>

### 7. What does the IAM Policy Simulator help with?
<details><summary>Answer</summary>It can evaluate whether a principal is allowed or denied for specific actions and resources, helping isolate identity-policy decisions. Resource policies and organization-level constraints may still require separate inspection.</details>

### 8. Why is `AdministratorAccess` a poor troubleshooting fix?
<details><summary>Answer</summary>It hides the actual authorization problem, violates least privilege and can create excessive production risk. The correct fix is to identify the exact denied action/resource/condition and grant only what is required.</details>

### 9. Can an identity policy Allow overcome an explicit Deny?
<details><summary>Answer</summary>No. An applicable explicit Deny wins.</details>

### 10. Give an IAM AccessDenied troubleshooting sequence.
<details><summary>Answer</summary>Identify caller → action → resource → identity policy → resource policy → boundary/session policy → SCP → conditions → explicit denies → retest the exact API operation.</details>

---

## DAY 9 — Cross-account IAM Roles and Trust Policies

### 1. What are the two main gates for cross-account AssumeRole?
<details><summary>Answer</summary>The source principal must be allowed to call `sts:AssumeRole`, and the target role's trust policy must trust that principal/account under the required conditions.</details>

### 2. What is the difference between a trust policy and a permissions policy?
<details><summary>Answer</summary>The trust policy answers who may assume the role. The permissions policy answers what the assumed role may do after it is assumed.</details>

### 3. Does a target role's trust policy grant S3 access?
<details><summary>Answer</summary>No. It permits assumption of the role. The role's permissions policies and applicable resource/organization controls determine what the assumed session can do.</details>

### 4. How do you verify the identity after AssumeRole?
<details><summary>Answer</summary>Use `aws sts get-caller-identity` with the temporary credentials and confirm the returned ARN represents the assumed role session.</details>

### 5. Why is trusting an exact source role usually better than trusting an entire account?
<details><summary>Answer</summary>It narrows the principals that can enter the target role, reducing unintended access and making the trust relationship easier to audit.</details>

### 6. What is ExternalId used for?
<details><summary>Answer</summary>It can be used as a condition in a role trust policy, especially for third-party access, to reduce confused-deputy risk when the external party assumes the role.</details>

### 7. AssumeRole succeeds but S3 GetObject fails. What does that prove?
<details><summary>Answer</summary>The basic trust relationship and source-side AssumeRole authorization worked. The next investigation should focus on target-role permissions, S3 resource policy, KMS, SCPs, boundaries, session policies and conditions.</details>

### 8. What is a common cross-account production mistake?
<details><summary>Answer</summary>Updating the target role permissions when the actual failure is the trust policy, or updating trust when AssumeRole already succeeds and the real failure is the target API authorization.</details>

### 9. What should you simulate for a cross-account incident?
<details><summary>Answer</summary>Test the source principal's `sts:AssumeRole` authorization and separately test the assumed role's required API action against the target resource.</details>

### 10. Explain cross-account access in one minute.
<details><summary>Answer</summary>Account A's principal must be permitted to call AssumeRole, Account B's role must trust that principal under its trust policy, and the resulting temporary role session must have permission for the target API. Resource policies, SCPs, boundaries, session policies and explicit denies can still restrict the final request.</details>

---

## DAY 10 — S3 Security, Encryption, Bucket Policies and Access Troubleshooting

### 1. What is the difference between an S3 bucket ARN and an object ARN?
<details><summary>Answer</summary>The bucket ARN is `arn:aws:s3:::bucket-name`, while objects are addressed as `arn:aws:s3:::bucket-name/*` or a specific key. Actions such as `ListBucket` and `GetObject` therefore commonly require different resource ARNs.</details>

### 2. What is Block Public Access?
<details><summary>Answer</summary>S3 Block Public Access provides account/bucket-level controls designed to prevent public access configurations. A public-looking bucket policy may still be ineffective when Block Public Access blocks it.</details>

### 3. What is the role of a bucket policy?
<details><summary>Answer</summary>A bucket policy is a resource-based policy that defines which principals can access the bucket or its objects and under what conditions.</details>

### 4. Can an S3 bucket policy Allow override an explicit Deny?
<details><summary>Answer</summary>No. An applicable explicit Deny wins regardless of another Allow.</details>

### 5. What is the difference between SSE-S3 and SSE-KMS?
<details><summary>Answer</summary>Both encrypt S3 objects at rest, but SSE-KMS uses AWS KMS keys and introduces additional KMS authorization and key-policy considerations. SSE-S3 is managed through S3's server-side encryption service.</details>

### 6. Why can `GetObject` fail even when `s3:GetObject` is allowed?
<details><summary>Answer</summary>The request can still be blocked by a bucket-policy Deny, Block Public Access, a condition mismatch, SCP/boundary/session restrictions, or KMS authorization when the object uses SSE-KMS.</details>

### 7. What KMS permission commonly matters when reading an SSE-KMS object?
<details><summary>Answer</summary>The caller needs the KMS permission required to use/decrypt with the key, subject to the key policy and other IAM constraints. The exact required action should be verified for the operation and key configuration rather than blindly granting broad KMS access.</details>

### 8. How would you troubleshoot an S3 AccessDenied error?
<details><summary>Answer</summary>Identify caller, action and resource; inspect IAM identity policies, bucket policy, Block Public Access, Object Ownership/ACLs, encryption and KMS, endpoint policy, conditions, SCPs, boundaries and explicit denies. Then retest the exact API call.</details>

### 9. What does `aws:SecureTransport` protect against in a bucket policy?
<details><summary>Answer</summary>A policy can explicitly deny requests when `aws:SecureTransport` is false, enforcing HTTPS transport for the bucket access path.</details>

### 10. How can a bucket policy make access depend on network path?
<details><summary>Answer</summary>Conditions such as `aws:SourceVpce` can restrict requests to a specific VPC endpoint. The same principal can therefore succeed through the approved endpoint and fail through another path.</details>

### 11. What is the difference between `s3:ListBucket` and `s3:GetObject`?
<details><summary>Answer</summary>`s3:ListBucket` operates on the bucket resource and controls listing keys. `s3:GetObject` operates on object resources and controls reading an object. Their resource ARNs are different.</details>

### 12. Why can a PutObject request fail because of encryption settings?
<details><summary>Answer</summary>A bucket policy can require a particular encryption method or KMS key and explicitly deny uploads that do not meet the required condition. The client must satisfy the policy's encryption requirements.</details>

### 13. What is Object Ownership?
<details><summary>Answer</summary>Object Ownership controls ownership behavior for objects uploaded to S3 and can disable ACL-based access management. Bucket-owner-enforced ownership is commonly used to simplify authorization around ACLs.</details>

### 14. Does KMS authorization replace S3 authorization?
<details><summary>Answer</summary>No. For an SSE-KMS object, S3 authorization and KMS authorization are separate decisions. Passing one does not automatically pass the other.</details>

### 15. How do you identify the exact policy statement responsible for an S3 denial?
<details><summary>Answer</summary>Match the request principal, action, resource and conditions against every applicable policy. Start with the exact API operation and use CloudTrail/IAM simulation where available, then inspect resource policies, KMS and organization controls for matching explicit denies.</details>

### 16. A role can list a bucket but cannot download an object. Why?
<details><summary>Answer</summary>The role may have `s3:ListBucket` on the bucket but lack `s3:GetObject` on the object ARN, or the object read may be blocked by a bucket policy, KMS or another condition.</details>

### 17. A role has GetObject but only fails from one subnet. What should you investigate?
<details><summary>Answer</summary>Check network-path conditions such as `aws:SourceVpce`, VPC endpoint policy, routing/DNS and any explicit bucket-policy Deny tied to the endpoint or source network.</details>

### 18. Is making an S3 bucket public a valid fix for an application AccessDenied error?
<details><summary>Answer</summary>Usually no. It weakens security and can still be blocked by Block Public Access. The correct fix is to authorize the application's specific principal and required action/resource while retaining restrictive public-access controls.</details>

### 19. What is the secure default approach for S3 access?
<details><summary>Answer</summary>Keep public access blocked unless there is a deliberate requirement, use least-privilege IAM/resource policies, enable appropriate encryption, prefer secure transport, restrict network paths where justified, and monitor access through AWS logging/auditing controls.</details>

### 20. Explain S3 AccessDenied troubleshooting in one minute.
<details><summary>Answer</summary>First identify the caller, exact S3 action and exact resource ARN. Then trace IAM identity policy, bucket policy, Block Public Access, Object Ownership/ACLs, encryption/KMS, VPC endpoint policy, SCP/boundary/session policies, conditions and explicit denies. Fix the first proven failing authorization layer and retest the exact operation instead of granting broad access.</details>

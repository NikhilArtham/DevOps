## DAY 8 — IAM Policy Evaluation, Explicit Deny and Least Privilege

### Lab 1 — Identify the Calling Principal
```bash
aws sts get-caller-identity
```
Record account, ARN and principal type. Do not begin policy troubleshooting until you know who is making the request.

### Lab 2 — Inspect Identity Policies
```bash
aws iam list-attached-role-policies --role-name <role-name>
aws iam list-role-policies --role-name <role-name>
aws iam get-policy-version --policy-arn <policy-arn> --version-id <version-id>
```
Map each statement to principal, action, resource and conditions.

### Lab 3 — Inspect an S3 Bucket Policy
```bash
aws s3api get-bucket-policy --bucket <bucket-name>
```
Find Allow and Deny statements affecting the failing action and object ARN.

### Lab 4 — Simulate a Principal Policy
```bash
aws iam simulate-principal-policy \
  --policy-source-arn <principal-arn> \
  --action-names s3:GetObject \
  --resource-arns arn:aws:s3:::<bucket>/*
```
Record the decision and identify which policy layer still needs investigation if the simulator does not explain a resource-policy or organization-level restriction.

### Lab 5 — Explicit-Deny Failure
Create a controlled test where an S3 request is allowed by an identity policy but denied by a bucket policy condition. Prove that the explicit deny wins and record the exact condition that matched.

### Lab 6 — Least-Privilege Cleanup
Start with an intentionally broad permission such as `s3:*` on `*`. Reduce it to the smallest required action/resource set and validate the required operation still succeeds.

### DAY 8 Capstone — AccessDenied Decision Tree
For an `AccessDenied` error record:
```text
Caller identity
Action
Resource
Identity policy
Resource policy
Permissions boundary
Session policy
SCP
Conditions
Explicit Deny
Final decision
```
Do not fix the incident by adding `AdministratorAccess`.

---

## DAY 9 — Cross-account IAM Roles and Trust Policies

### Lab 1 — Trace the Two-Gate AssumeRole Path
Document:
```text
Account A principal
  ↓ sts:AssumeRole permission
Account B role ARN
  ↓ trust policy
Temporary role session
  ↓ target permissions
AWS API
```
Identify the exact failing gate in a controlled test.

### Lab 2 — Inspect a Role Trust Policy
```bash
aws iam get-role --role-name <role-name> \
  --query 'Role.AssumeRolePolicyDocument'
```
Check principal, action `sts:AssumeRole` and conditions such as `sts:ExternalId` where applicable.

### Lab 3 — Test AssumeRole
```bash
aws sts assume-role \
  --role-arn arn:aws:iam::<target-account>:role/<role-name> \
  --role-session-name devops-lab
```
Use the returned temporary credentials only in a controlled shell/session and verify:
```bash
aws sts get-caller-identity
```

### Lab 4 — Separate AssumeRole from Target API Permission
After AssumeRole succeeds, test the target API. If it fails, prove that the trust policy is no longer the problem and inspect the target role's permissions, resource policy, SCP, boundary and conditions.

### Lab 5 — Least-Privilege Trust Policy
Compare:
```text
Trust entire source account
```
with:
```text
Trust exact CI role
```
Use conditions where appropriate and explain why the narrower trust relationship reduces unintended access.

### DAY 9 Capstone — CI-to-Production AccessDenied
Scenario:
```text
CI role in Account A
→ AssumeRole
→ Production role in Account B
→ S3 API
```
Investigate both gates, identify the exact denied statement, correct only the required permission/trust relationship and validate the final API call.


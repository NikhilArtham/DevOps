name: Sync AWS central study files

on:
  push:
    paths:
      - '.github/workflows/update-aws-central-study-files.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Append AWS DAY 6-10 labs and interview questions
        shell: bash
        run: |
          set -euo pipefail

          cat >> aws/LABS.md <<'EOF'

---

## DAY 6 — EC2 Boot, User-Data, Metadata and System Troubleshooting

### Lab 1 — Inspect EC2 State and Status Checks
```bash
aws ec2 describe-instances --instance-ids <instance-id> \
  --query 'Reservations[].Instances[].{State:State.Name,Instance:InstanceId,Subnet:SubnetId,PrivateIP:PrivateIpAddress}'
aws ec2 describe-instance-status --instance-ids <instance-id> --include-all-instances
```
Record instance state, system status, instance status and reachability symptoms.

### Lab 2 — Investigate User-Data and cloud-init
On a Linux EC2 instance:
```bash
cloud-init status --long
sudo tail -n 100 /var/log/cloud-init.log
sudo tail -n 100 /var/log/cloud-init-output.log
```
Determine whether user-data executed, which command failed, and whether the failure prevented the application from starting.

### Lab 3 — Test IMDSv2
```bash
TOKEN=$(curl -sS -X PUT 'http://169.254.169.254/latest/api/token' \
  -H 'X-aws-ec2-metadata-token-ttl-seconds: 21600')
curl -sS -H "X-aws-ec2-metadata-token: $TOKEN" \
  http://169.254.169.254/latest/meta-data/instance-id
```
Explain why IMDSv2 uses a session token and inspect the instance metadata options from AWS.

### Lab 4 — Diagnose an SSH Failure
```bash
ss -lntp | grep ':22'
sudo systemctl status sshd
ssh -v ec2-user@<private-or-public-ip>
```
Trace the failure through route, Security Group/NACL, host firewall, SSH service and credentials.

### Lab 5 — Use SSM Instead of SSH
```bash
aws ssm describe-instance-information
aws ssm start-session --target <instance-id>
```
Confirm the instance is a managed node and identify the IAM/network/agent dependency that makes Session Manager work.

### Lab 6 — Application Port Troubleshooting
```bash
ss -lntp
curl -v http://127.0.0.1:<port>/health
curl -v http://<private-ip>:<port>/health
```
Compare loopback and private-IP behavior and identify a loopback-only binding failure.

### Lab 7 — EC2 Boot Failure Capstone
Scenario:
```text
Route 53 → ALB :443 → Target Group → EC2 :8080
ALB reports target unhealthy
EC2 state = running
```
Use status checks, SSM, cloud-init logs, systemd, `ss` and `curl` to prove whether the root cause is AWS networking or EC2 bootstrap/application startup. Record root cause, exact evidence, fix and validation.


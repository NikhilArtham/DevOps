## DAY 10 — S3 Security, Encryption, Bucket Policies and Access Troubleshooting

### Lab 1 — Identify the Exact S3 Caller and Operation
```bash
aws sts get-caller-identity
aws s3api head-object --bucket <bucket> --key <key>
aws s3api get-object --bucket <bucket> --key <key> /tmp/object
```
Record principal, action, bucket ARN, object ARN and exact error.

### Lab 2 — Inspect Bucket Policy and Public Access Controls
```bash
aws s3api get-bucket-policy --bucket <bucket>
aws s3api get-public-access-block --bucket <bucket>
aws s3api get-bucket-ownership-controls --bucket <bucket>
```
Identify every Allow/Deny statement affecting the request and verify whether Block Public Access prevents the intended public configuration.

### Lab 3 — Trace Object Ownership and ACLs
Inspect whether Object Ownership is enabled and whether ACLs are relevant. Explain why an ACL cannot be used as a shortcut around a bucket policy or Block Public Access control.

### Lab 4 — Inspect Default Encryption
```bash
aws s3api get-bucket-encryption --bucket <bucket>
```
Identify SSE-S3, SSE-KMS or another configured mode. If SSE-KMS is used, record the KMS key ARN and explain that S3 access and KMS authorization are separate policy decisions.

### Lab 5 — Diagnose SSE-KMS AccessDenied
Scenario:
```text
IAM allows s3:GetObject
Bucket policy allows s3:GetObject
GetObject still returns AccessDenied
```
Investigate KMS key policy, IAM permissions for the required KMS operation, key state and any explicit deny/condition. Prove why the S3 permission alone is insufficient.

### Lab 6 — Enforce Secure Transport
Inspect a bucket policy containing a deny such as:
```text
aws:SecureTransport = false
```
Test HTTP vs HTTPS behavior in a safe test environment and identify the exact Deny statement responsible for rejection.

### Lab 7 — VPC Endpoint Restricted Bucket Access
Inspect a bucket policy using a condition such as `aws:SourceVpce`. Test access from the expected VPC endpoint path and from an alternate path. Explain why the same IAM principal can succeed through one network path and fail through another.

### Lab 8 — PutObject Encryption Enforcement
Create a controlled bucket policy that requires an encryption header for uploads. Test:
```bash
aws s3 cp test.txt s3://<bucket>/test.txt
```
and then the required encryption configuration. Identify the Deny statement when the required condition is missing.

### Lab 9 — S3 Access Troubleshooting Matrix
For each failure, identify the first failing layer:
```text
IAM identity policy
Bucket policy
Block Public Access
Object Ownership / ACL
S3 encryption
KMS key policy/permissions
VPC endpoint policy
SCP / permissions boundary
Condition mismatch
```
Do not add broad permissions until the exact denied layer is proven.

### DAY 10 Capstone — Production S3 GetObject Failure
Scenario:
```text
Application role
  ↓
S3 GetObject
  ↓
SSE-KMS encrypted object
```
The application receives `AccessDenied`. Trace:
```text
Caller identity
→ s3:GetObject permission
→ bucket policy
→ public-access controls
→ object ownership/ACL
→ KMS authorization
→ explicit denies/conditions
```
Identify the exact denied statement, apply the least-privilege fix and prove the request succeeds.
